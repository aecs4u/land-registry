<!doctype html>
<html lang="{{ page_lang|default(locale|default('it')) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ _('Sign out of your Land Registry account.') }}">
  <meta name="theme-color" content="#1a5490">
  <title>{{ _('Sign out') }} · Land Registry</title>
  <link rel="icon" type="image/svg+xml" href="/static/land-registry-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/land-registry-icon-32.png">
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/land-registry-icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/aecs4u-theme/css/design-tokens.css">
  <link rel="stylesheet" href="/static/aecs4u-theme/css/components.css">
  <link rel="stylesheet" href="{{ asset_url('css/auth.css') }}">
</head>
<body class="auth-logout-page">
  <nav class="auth-logout-nav" aria-label="{{ _('Main navigation') }}">
    <a href="/map" class="auth-logout-brand">{{ _('Land Registry') }}</a>
    <div class="auth-logout-languages" aria-label="{{ _('Language') }}">
      <a href="/auth/logout?lang=it" lang="it"{% if locale == 'it' %} aria-current="page"{% endif %}>Italiano</a>
      <a href="/auth/logout?lang=en" lang="en"{% if locale == 'en' %} aria-current="page"{% endif %}>English</a>
    </div>
  </nav>
  <main id="main-content" class="auth-logout-main">
    <section class="auth-logout-card" aria-labelledby="logout-title">
      <span class="auth-logout-mark" aria-hidden="true">▦</span>
      <p class="auth-logout-eyebrow">{{ _('Land Registry account') }}</p>
      <h1 id="logout-title">{{ _('Sign out?') }}</h1>
      <p>{{ _('You will be signed out of this browser. You can sign in again at any time.') }}</p>
      <form method="post" action="/auth/signout" class="auth-logout-actions">
        <button type="submit" class="btn btn-primary">{{ _('Sign out') }}</button>
        <a href="/map" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
      </form>
    </section>
  </main>
  <footer class="auth-logout-footer">
    <a href="/privacy">{{ _('Privacy') }}</a>
    <a href="/terms">{{ _('Terms') }}</a>
    <a href="/help">{{ _('Help') }}</a>
  </footer>
</body>
</html>
