<div id="mapTaskProgress" class="map-task-progress" hidden>
  <div class="map-task-progress-heading">
    <span id="mapTaskProgressLabel" role="status" aria-live="polite"></span>
    <span id="mapTaskProgressElapsed" aria-hidden="true"></span>
  </div>
  <div id="mapTaskProgressBar" class="map-task-progress-track" role="progressbar"
       aria-labelledby="mapTaskProgressLabel" aria-valuemin="0" aria-valuemax="100">
    <div id="mapTaskProgressFill" class="map-task-progress-fill"></div>
  </div>
  <div id="mapTaskProgressDetail" class="map-task-progress-detail"></div>
</div>
