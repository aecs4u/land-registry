# =============================================================================
# Lighthouse Deployment Configuration
# =============================================================================
# Generated from template: deploy-config.yaml.j2
# Environment: production
#
# This configuration is rendered from environment variables defined in .env
# To customize, set the corresponding environment variables before deployment.
#
# Usage:
#   lighthouse config render                    # Render using .env
#   lighthouse config render --env-file .env.prod  # Use specific env file
#   lighthouse cloudrun deploy --render-config  # Render and deploy
# =============================================================================


# -----------------------------------------------------------------------------
# Google Cloud Platform Configuration
# -----------------------------------------------------------------------------
gcp:
  project_id: "apps-aecs4u"
  region: "europe-west1"
  service_name: "land-registry-service"

# -----------------------------------------------------------------------------
# Cloud Run Configuration
# -----------------------------------------------------------------------------
cloudrun:
  # Resource allocation - varies by environment
  memory: "1Gi"
  cpu: 1
  min_instances: 0
  max_instances: 2
  concurrency: 80

  # Environment and runtime
  execution_environment: "gen2"
  platform: "managed"
  port: 8080
  timeout: 300

  # Performance settings
  cpu_boost: true
  no_cpu_throttling: false

  # Security
  allow_unauthenticated: true
  vpc_connector: ""
  session_affinity: false

  # Cloud SQL connection (format: project:region:instance)
  cloudsql_instances: ""

  # Health checks
  startup_probe_timeout: 600

# -----------------------------------------------------------------------------
# Cloud Build Configuration (for GAR authentication)
# -----------------------------------------------------------------------------
cloudbuild:
  repository: "cloud-run-source-deploy"
  timeout: "1200s"
  machine_type: ""
  gar_repository: "python-packages"

# -----------------------------------------------------------------------------
# Docker Configuration
# -----------------------------------------------------------------------------
docker:
  base_image: "python:3.12-alpine"
  working_dir: "/app"
  exposed_port: 8080

  # Non-root user configuration
  user:
    name: "appuser"
    uid: 1000
    gid: 1000

  # Build dependencies (Alpine packages)
  build_packages:
    - gcc
    - g++
    - musl-dev
    - linux-headers
    - postgresql-dev
    - libffi-dev
    - cargo
    - rust
    - git
    - curl

  # Runtime dependencies (Alpine packages)
  runtime_packages:
    - libpq
    - libffi
    - curl
    - ca-certificates
    - tini

  # App directories
  directories:
    - "/app/static"
    - "/app/templates"
    - "/app/data"

  # Entrypoint
  entrypoint:
    - "python"
    - "main-cloudrun.py"

# -----------------------------------------------------------------------------
# Application Configuration
# -----------------------------------------------------------------------------
main_cloudrun:
  app_name: "Land Registry Viewer"
  app_module: "lighthouse"
  app_main_module: "main"
  health_path: "api/v1/health"
  docs_path: "docs"
  log_level: "WARNING"
  access_log: false
  gcs_database_enabled: false
  default_port: 8080

# -----------------------------------------------------------------------------
# Environment Variables (passed to Cloud Run)
# -----------------------------------------------------------------------------
env_vars:
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  LOGFIRE_TOKEN: "pylf_v1_eu_XCggY9q8MCsYrPxyjf21T9tnRdwkJY6l2VD242v9Ns7R"
  DATABASE_URL: "postgresql://neondb_owner:npg_by4FnPipXJ9M@ep-shy-shape-a2rpjawn-pooler.eu-central-1.aws.neon.tech/land-registry?sslmode=require"
  CLERK_SECRET_KEY: "sk_test_QrIjZ4fQHgHsSlbdNIFyEagl1KOds5jygTi9SGjEeU"
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2hhbXBpb24tbXVsbGV0LTc2LmNsZXJrLmFjY291bnRzLmRldiQ"

# -----------------------------------------------------------------------------
# Secret Environment Variables (from GCP Secret Manager)
# -----------------------------------------------------------------------------
# For production, consider using Secret Manager instead of env_vars:
# secret_env_vars:
#   DATABASE_URL: "database-url:latest"
#   SECRET_KEY: "app-secret-key:latest"
#   CLERK_SECRET_KEY: "clerk-secret-key:latest"

# -----------------------------------------------------------------------------
# Pre-deployment Checks
# -----------------------------------------------------------------------------
pre_deployment:
  lint_check: true
  type_check: true
  fail_on_lint_error: false
  fail_on_type_error: false
  lint_path: "."
  type_check_path: "."

# -----------------------------------------------------------------------------
# Template Configuration
# -----------------------------------------------------------------------------
templates:
  directory: "lighthouse/templates"
  dockerfile: "Dockerfile"
  main_cloudrun: "main-cloudrun.py"

# -----------------------------------------------------------------------------
# Provider Configuration
# -----------------------------------------------------------------------------
providers:
  local_docker:
    dockerfile: "Dockerfile"
    template: "lighthouse/templates/Dockerfile"
    image_name: "lighthouse-service:production"
    context: "."
    render_template: true
    no_cache: false
    pull: false
    push: false

# -----------------------------------------------------------------------------
# Script Configuration
# -----------------------------------------------------------------------------
script:
  cleanup_files:
    - "Dockerfile"
    - "main-cloudrun.py"

  required_apis:
    - "run.googleapis.com"
    - "cloudbuild.googleapis.com"
    - "logging.googleapis.com"
    - "secretmanager.googleapis.com"

# -----------------------------------------------------------------------------
# Labels (for resource organization)
# -----------------------------------------------------------------------------
labels:
  app: "lighthouse"
  environment: "production"
  managed-by: "lighthouse-cli"