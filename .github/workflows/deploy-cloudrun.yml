name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: apps-aecs4u
  GCP_REGION:     europe-west1
  SERVICE_NAME:   land-registry-service
  IMAGE_BASE:     europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/land-registry-service

jobs:
  deploy:
    name: Build, push & deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Fetch GitHub token for private package reads
        run: |
          GH_PAT=$(gcloud secrets versions access latest \
            --secret=GITHUB_TOKEN --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::${GH_PAT}"
          echo "BUILD_GITHUB_TOKEN=${GH_PAT}" >> "$GITHUB_ENV"

      - name: Compute image tag
        id: img
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            GITHUB_TOKEN=${{ env.BUILD_GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE_BASE }}:sha-${{ steps.img.outputs.sha_short }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_BASE }}:sha-${{ steps.img.outputs.sha_short }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --allow-unauthenticated \
            --ingress=all \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --concurrency=80 \
            --execution-environment=gen2 \
            --port=8080 \
            --timeout=300 \
            --cpu-boost \
            --cpu-throttling \
            --set-env-vars="ENVIRONMENT=production,DEBUG=false,LOG_LEVEL=INFO,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2hhbXBpb24tbXVsbGV0LTc2LmNsZXJrLmFjY291bnRzLmRldiQ,CLERK_JWKS_URL=https://champion-mullet-76.clerk.accounts.dev/.well-known/jwks.json" \
            --set-secrets="SECRET_KEY=LAND_REGISTRY_SECRET_KEY:latest,SESSION_SECRET_KEY=LAND_REGISTRY_SESSION_SECRET_KEY:latest,DATABASE_URL=LAND_REGISTRY_DATABASE_URL:latest,CLERK_SECRET_KEY=LAND_REGISTRY_CLERK_SECRET_KEY:latest,LOGFIRE_TOKEN=LAND_REGISTRY_LOGFIRE_TOKEN:latest"

          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Run health check
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL/health" || echo 000)
            echo "attempt $i: /health -> $CODE"
            [ "$CODE" = "200" ] && { echo "Health check passed"; exit 0; }
            sleep 6
          done
          echo "/health did not return 200 after 10 attempts"; exit 1
