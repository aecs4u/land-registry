name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'apps-aecs4u' }}
  GCP_REGION:     ${{ vars.GCP_REGION || 'europe-west1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'land-registry-service' }}
  IMAGE_BASE: ${{ vars.ARTIFACT_REGISTRY_IMAGE || 'europe-west1-docker.pkg.dev/apps-aecs4u/cloud-run-source-deploy/land-registry-service' }}

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Private aecs4u packages are installed from GitHub, same as the image build.
      - name: Configure private package access
        run: |
          GH_PAT=$(gcloud secrets versions access latest \
            --secret=GITHUB_TOKEN --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::${GH_PAT}"
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q --no-header

  deploy:
    name: Build, push & deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate production data and Clerk configuration
        env:
          ALLOW_CLERK_TEST_KEYS: ${{ vars.ALLOW_CLERK_TEST_KEYS }}
        run: |
          set -euo pipefail
          gcloud secrets describe LAND_REGISTRY_CADASTRAL_POSTGRES_DSN \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Create Secret Manager secret LAND_REGISTRY_CADASTRAL_POSTGRES_DSN with the dedicated map-source DSN before deploying."
              exit 1
            }
          gcloud secrets describe LAND_REGISTRY_CLERK_PUBLISHABLE_KEY \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Create Secret Manager secret LAND_REGISTRY_CLERK_PUBLISHABLE_KEY with the Clerk publishable key before deploying."
              exit 1
            }
          gcloud secrets describe LAND_REGISTRY_CLERK_JWKS_URL \
            --project="${{ env.GCP_PROJECT_ID }}" >/dev/null || {
              echo "::error::Create Secret Manager secret LAND_REGISTRY_CLERK_JWKS_URL with the Clerk JWKS URL before deploying."
              exit 1
            }
          CLERK_PUBLISHABLE_KEY=$(gcloud secrets versions access latest \
            --secret=LAND_REGISTRY_CLERK_PUBLISHABLE_KEY \
            --project="${{ env.GCP_PROJECT_ID }}")
          CLERK_JWKS_URL=$(gcloud secrets versions access latest \
            --secret=LAND_REGISTRY_CLERK_JWKS_URL \
            --project="${{ env.GCP_PROJECT_ID }}")
          echo "::add-mask::${CLERK_PUBLISHABLE_KEY}"
          echo "::add-mask::${CLERK_JWKS_URL}"
          case "$CLERK_PUBLISHABLE_KEY" in
            pk_live_*) ;;
            pk_test_*) [ "$ALLOW_CLERK_TEST_KEYS" = "true" ] || { echo "::error::Production requires the pk_live Clerk publishable key (set repo variable ALLOW_CLERK_TEST_KEYS=true to accept test-mode keys)."; exit 1; } ;;
            *) echo "::error::LAND_REGISTRY_CLERK_PUBLISHABLE_KEY must contain a Clerk publishable key."; exit 1 ;;
          esac
          case "$CLERK_JWKS_URL" in
            https://*'/.well-known/jwks.json') ;;
            *) echo "::error::LAND_REGISTRY_CLERK_JWKS_URL must contain the HTTPS JWKS endpoint for the Clerk instance."; exit 1 ;;
          esac
          case "$CLERK_JWKS_URL" in
            *.clerk.accounts.dev/*|*.clerk.dev/*)
              if [ "$ALLOW_CLERK_TEST_KEYS" != "true" ]; then
                echo "::error::Production cannot use a Clerk development-domain JWKS endpoint."
                exit 1
              fi
              ;;
          esac
          CLERK_SECRET_KEY=$(gcloud secrets versions access latest \
            --secret=LAND_REGISTRY_CLERK_SECRET_KEY \
            --project="${{ env.GCP_PROJECT_ID }}")
          case "$CLERK_SECRET_KEY" in
            sk_live_*) ;;
            sk_test_*) [ "$ALLOW_CLERK_TEST_KEYS" = "true" ] || { unset CLERK_SECRET_KEY; echo "::error::LAND_REGISTRY_CLERK_SECRET_KEY must contain a production Clerk secret key."; exit 1; } ;;
            *) unset CLERK_SECRET_KEY; echo "::error::LAND_REGISTRY_CLERK_SECRET_KEY must contain a production Clerk secret key."; exit 1 ;;
          esac
          unset CLERK_SECRET_KEY

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Fetch GitHub token for private package reads
        run: |
          GH_PAT=$(gcloud secrets versions access latest \
            --secret=GITHUB_TOKEN --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::${GH_PAT}"
          echo "BUILD_GITHUB_TOKEN=${GH_PAT}" >> "$GITHUB_ENV"

      - name: Compute image tag
        id: img
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GITHUB_TOKEN=${{ env.BUILD_GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE_BASE }}:sha-${{ steps.img.outputs.sha_short }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          CLOUD_RUN_TAG="preflight-${{ steps.img.outputs.sha_short }}"
          SECRET_UPDATES="SECRET_KEY=LAND_REGISTRY_SECRET_KEY:latest,SESSION_SECRET_KEY=LAND_REGISTRY_SESSION_SECRET_KEY:latest,DATABASE_URL=LAND_REGISTRY_DATABASE_URL:latest,CLERK_PUBLISHABLE_KEY=LAND_REGISTRY_CLERK_PUBLISHABLE_KEY:latest,CLERK_SECRET_KEY=LAND_REGISTRY_CLERK_SECRET_KEY:latest,CLERK_JWKS_URL=LAND_REGISTRY_CLERK_JWKS_URL:latest,LOGFIRE_TOKEN=LAND_REGISTRY_LOGFIRE_TOKEN:latest,CADASTRAL_POSTGRES_DSN=LAND_REGISTRY_CADASTRAL_POSTGRES_DSN:latest"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_BASE }}:sha-${{ steps.img.outputs.sha_short }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --service-account=land-registry-runtime@apps-aecs4u.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --ingress=all \
            --memory="${{ vars.CLOUDRUN_MEMORY || '512Mi' }}" \
            --cpu="${{ vars.CLOUDRUN_CPU || '1' }}" \
            --min-instances="0" \
            --no-traffic \
            --tag="$CLOUD_RUN_TAG" \
            --max-instances="${{ vars.CLOUDRUN_MAX_INSTANCES || '3' }}" \
            --concurrency="${{ vars.CLOUDRUN_CONCURRENCY || '80' }}" \
            --execution-environment="${{ vars.CLOUDRUN_EXECUTION_ENV || 'gen2' }}" \
            --port="${{ vars.CLOUDRUN_PORT || '8080' }}" \
            --timeout="${{ vars.CLOUDRUN_TIMEOUT || '300' }}" \
            --cpu-boost \
            --cpu-throttling \
            --update-env-vars="ENVIRONMENT=production,LAND_REGISTRY_PUBLIC_BASE_URL=https://land-registry.aecs4u.com,STATS_POSTGRES_ENABLE=1" \
            --remove-env-vars="DEBUG,LOG_LEVEL,AUTH_MODE,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,STATS_POSTGRES_SOURCE_FALLBACK_ENABLE" \
            --update-secrets="$SECRET_UPDATES"

          SERVICE_JSON=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format=json)
          REVISION=$(python -c 'import json,sys; print(json.load(sys.stdin)["status"]["latestCreatedRevisionName"])' <<< "$SERVICE_JSON")
          URL=$(python -c 'import json,sys; tag=sys.argv[1]; d=json.load(sys.stdin); print(next((item.get("url", "") for item in d["status"].get("traffic", []) if item.get("tag") == tag), ""))' "$CLOUD_RUN_TAG" <<< "$SERVICE_JSON")
          [ -n "$URL" ] || { echo "::error::Could not resolve the tagged Cloud Run candidate URL."; exit 1; }
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"

      - name: Check candidate health
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL/health" || echo 000)
            echo "attempt $i: /health -> $CODE"
            [ "$CODE" = "200" ] && { echo "Health check passed"; exit 0; }
            sleep 6
          done
          echo "/health did not return 200 after 10 attempts"; exit 1

      # Keep the previous revision serving traffic unless the candidate's
      # canonical map source is ready.
      - name: Require candidate map readiness
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 30 "$URL/ready" || true)
          [ -n "$CODE" ] || CODE=000
          echo "/ready -> $CODE"; cat /tmp/ready.json 2>/dev/null || true
          {
            echo "## Map data readiness"
            echo "Deployment URL: $URL"
            echo "Readiness response: HTTP $CODE"
            echo '```json'
            cat /tmp/ready.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CODE" = "200" ] || { echo "::error::/ready returned $CODE: the canonical map data source is not serving"; exit 1; }

      - name: Verify candidate map health endpoint
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --max-time 30 \
            "$URL/api/v1/map/layers/health" > /tmp/canonical-map-health.json
          python -c 'import json; d=json.load(open("/tmp/canonical-map-health.json")); print("map health endpoint passed; postgis_available=", d.get("available"), "layers=", len(d.get("layers", [])))'

      - name: Promote ready revision
        run: |
          gcloud run services update-traffic "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --to-revisions="${{ steps.deploy.outputs.revision }}=100"

      - name: Verify promoted service
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          curl --fail --silent --show-error --max-time 30 "$URL/health"
